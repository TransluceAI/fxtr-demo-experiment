[project]
name = "fxtr-demo-experiment"
version = "0.1.0"
description = "A message judging benchmark for fxtr"
requires-python = ">=3.13"
dependencies = [
    "anyio",
    "behaviors[models]==0.0.1a5",
    "fxtr[runner,debug-web]==0.2.0a0",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/message_judge_bench"]

[tool.fxtr]
modules = ["message_judge_bench.pipeline"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "launch.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
